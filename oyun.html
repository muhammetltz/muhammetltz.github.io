<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MGL Fizik Lab</title>
    <style>
        :root { --bg: #0f172a; --primary: #f59e0b; }
        body { margin: 0; overflow: hidden; background: var(--bg); color: white; font-family: sans-serif; touch-action: none; /* DOKUNMATİK KAYDIRMAYI KAPAT */ }

        /* HEADER (KÜÇÜK VE ÜSTTE) */
        header {
            position: absolute; top: 0; left: 0; width: 100%; padding: 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10; pointer-events: none; box-sizing: border-box;
        }
        .back-btn {
            pointer-events: auto; text-decoration: none; color: white; 
            background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 20px; font-size: 0.9rem;
        }

        /* OYUN PANELİ (ALTTA SABİT) */
        #ui {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: rgba(15, 23, 42, 0.9);
            padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2);
            text-align: center; pointer-events: none;
        }
        .controls { display: flex; gap: 5px; pointer-events: auto; }
        .btn {
            flex: 1; padding: 12px 5px; border-radius: 8px; border: none; 
            background: rgba(255,255,255,0.1); color: white; font-weight: bold; font-size: 0.9rem;
        }
        .btn.active { background: var(--primary); color: black; }
        .btn.danger { background: rgba(220, 38, 38, 0.4); }
        
        #info { position: absolute; top: 50px; width: 100%; text-align: center; opacity: 0.7; pointer-events: none; font-size: 0.8rem; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/", "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js" } }
    </script>
</head>
<body>
    <header>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Geri</a>
        <div style="font-weight:bold;">MGL<span style="color:var(--primary)">.LAB</span></div>
    </header>

    <div id="info">Dokunarak İnşa Et • Çift Parmak: Kamera</div>

    <div id="ui">
        <div class="controls">
            <button class="btn active" id="b-build" onclick="setMode('build')">İnşa</button>
            <button class="btn" id="b-test" onclick="setMode('test')">Test</button>
            <button class="btn danger" onclick="reset()">Sil</button>
        </div>
        <div style="margin-top:5px; font-size:0.7rem; color:#aaa;">Nesne: <span id="cnt">0</span></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as CANNON from 'cannon-es';

        let camera, scene, renderer, world, raycaster, mouse;
        let objects=[], clickable=[];
        let mode='build';

        function init() {
            scene = new THREE.Scene(); scene.background=new THREE.Color(0x0f172a); scene.fog=new THREE.Fog(0x0f172a,20,100);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 500);
            camera.position.set(10,15,15);

            // Işıklar
            scene.add(new THREE.AmbientLight(0xffffff,0.6));
            const dl = new THREE.DirectionalLight(0xffffff,1.5); dl.position.set(10,30,10); scene.add(dl);

            // Fizik
            world = new CANNON.World(); world.gravity.set(0,-9.82,0); world.broadphase = new CANNON.SAPBroadphase(world);

            // Zemin
            const grid = new THREE.GridHelper(100,50,0x38bdf8,0x1e293b); scene.add(grid);
            const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.MeshBasicMaterial({visible:false}));
            floorMesh.rotation.x = -Math.PI/2; scene.add(floorMesh); clickable.push(floorMesh);
            
            const floorBody = new CANNON.Body({mass:0, shape:new CANNON.Plane()});
            floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2); world.addBody(floorBody);

            renderer = new THREE.WebGLRenderer({antialias:true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping=true;

            raycaster = new THREE.Raycaster(); mouse = new THREE.Vector2();

            window.addEventListener('resize', ()=>{
                camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth,window.innerHeight);
            });

            renderer.domElement.addEventListener('pointerdown', onTouch);
        }

        function createBox(pos) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color:0x94a3b8}));
            mesh.position.copy(pos); scene.add(mesh); clickable.push(mesh);
            const body = new CANNON.Body({mass:5, position:new CANNON.Vec3(pos.x,pos.y,pos.z), shape:new CANNON.Box(new CANNON.Vec3(1,1,1))});
            world.addBody(body); objects.push({mesh,body}); updateCnt();
        }

        function createBall(pos, vel) {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.7), new THREE.MeshStandardMaterial({color:0xf59e0b}));
            mesh.position.copy(pos); scene.add(mesh);
            const body = new CANNON.Body({mass:10, position:new CANNON.Vec3(pos.x,pos.y,pos.z), shape:new CANNON.Sphere(0.7)});
            body.velocity.copy(vel); world.addBody(body); objects.push({mesh,body}); updateCnt();
        }

        function onTouch(e) {
            if(e.target.tagName==='BUTTON') return;
            mouse.x=(e.clientX/window.innerWidth)*2-1; mouse.y=-(e.clientY/window.innerHeight)*2+1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(clickable);
            if(hits.length>0) {
                const hit=hits[0];
                if(mode==='build') {
                    const tx=Math.round(hit.point.x/2)*2; const tz=Math.round(hit.point.z/2)*2;
                    let ty=(hit.face.normal.y>0.5)? hit.point.y+1 : hit.point.y; if(ty<1) ty=1;
                    createBox(new THREE.Vector3(tx,ty,tz));
                } else {
                    const start=camera.position.clone();
                    const dir=new THREE.Vector3().subVectors(hit.point,start).normalize();
                    createBall(start.add(dir.multiplyScalar(3)), new CANNON.Vec3(dir.x*30,dir.y*30,dir.z*30));
                }
            }
        }

        function anim() {
            requestAnimationFrame(anim); world.step(1/60);
            objects.forEach(o=>{ o.mesh.position.copy(o.body.position); o.mesh.quaternion.copy(o.body.quaternion); });
            renderer.render(scene, camera);
        }
        
        function updateCnt(){ document.getElementById('cnt').innerText=objects.length; }

        window.setMode=(m)=>{
            mode=m; document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
            document.getElementById('b-'+m).classList.add('active');
        }
        window.reset=()=>{
            objects.forEach(o=>{ world.removeBody(o.body); scene.remove(o.mesh); });
            objects=[]; clickable=clickable.filter(o=>o.geometry.type==='PlaneGeometry'); updateCnt();
        }

        init(); anim();
    </script>
</body>
</html>
