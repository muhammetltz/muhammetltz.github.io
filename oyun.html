<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fizik Tabanlı Yapı Testi | MGL</title>
    <style>
        /* --- TASARIM AYARLARI --- */
        :root {
            --bg-color: #0f172a;
            --primary: #f59e0b;
            --secondary: #38bdf8;
            --text-main: #f1f5f9;
        }

        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-main); }

        /* UI PANELİ */
        #ui-container {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            text-align: center; user-select: none; backdrop-filter: blur(5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%; max-width: 500px; pointer-events: none;
        }
        
        .btn {
            pointer-events: auto;
            background: var(--secondary); color: #000; border: none;
            padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer;
            margin: 0 5px; transition: 0.2s;
        }
        .btn:hover { transform: scale(1.05); filter: brightness(1.2); }
        .btn.danger { background: #ef4444; color: white; }
        .btn.active { background: var(--primary); color: white; box-shadow: 0 0 10px var(--primary); }

        h2 { margin: 0 0 10px 0; font-size: 1.2rem; color: var(--primary); }
        p { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 15px; }
        
        /* HEADER */
        header {
            position: absolute; top: 0; width: 100%; padding: 20px;
            display: flex; justify-content: space-between; z-index: 10; pointer-events: none;
        }
        .home-btn {
            pointer-events: auto; text-decoration: none; color: white; 
            background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 5px;
            backdrop-filter: blur(5px); font-weight: 500;
        }

        #instruction {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7); color: white; padding: 20px; border-radius: 10px;
            pointer-events: none; transition: opacity 0.5s; z-index: 99; text-align: center;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>

    <header>
        <a href="index.html" class="home-btn">← Ana Sayfa</a>
        <div style="color:var(--secondary); font-weight:bold;">MGL.PHYSICS</div>
    </header>

    <div id="instruction">
        <h3>NASIL OYNANIR?</h3>
        <p>Sol Tık: Blok Ekle (Üst üste diz)</p>
        <p>Sağ Tık + Sürükle: Kamerayı Çevir</p>
        <p>Modu Değiştirip "Gülle" atarak binayı yık!</p>
        <small>Başlamak için bir yere tıkla...</small>
    </div>

    <div id="ui-container">
        <h2>Yapısal Dayanıklılık Testi</h2>
        <p>Mod Seçimi:</p>
        <button class="btn active" id="btn-build" onclick="setMode('build')">🏗️ İnşa Et</button>
        <button class="btn" id="btn-test" onclick="setMode('test')">💣 Gülle At (Test)</button>
        <button class="btn danger" onclick="resetWorld()">♻️ Sıfırla</button>
        <div style="margin-top:10px; font-size:0.8rem; opacity:0.7;">Nesne Sayısı: <span id="count">0</span></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as CANNON from 'cannon-es';

        // DEĞİŞKENLER
        let camera, scene, renderer;
        let world; // Fizik Dünyası
        let timeStep = 1 / 60;
        let objectsToUpdate = []; // Fizik ve Görseli eşleştirmek için
        let raycaster, mouse;
        
        let mode = 'build'; // 'build' veya 'test'
        let planeBody; 

        // Materyaller
        const concreteMaterial = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.5 });
        const testBallMaterial = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.5, roughness: 0.1 });

        init();
        animate();

        function init() {
            // 1. SCENE & CAMERA
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.Fog(0x0f172a, 20, 100);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(10, 15, 20);

            // 2. IŞIKLAR & GÖLGELER
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // 3. FİZİK DÜNYASI (CANNON.JS)
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0); // Yer çekimi (m/s^2)
            world.broadphase = new CANNON.SAPBroadphase(world);
            world.allowSleep = true; // Performans için duran nesneleri uyut

            // Fizik Malzemeleri (Sürtünme ve Sekme)
            const defaultMaterial = new CANNON.Material('default');
            const defaultContactMaterial = new CANNON.ContactMaterial(defaultMaterial, defaultMaterial, {
                friction: 0.4, // Sürtünme
                restitution: 0.1 // Sekme (Beton çok sekmez)
            });
            world.addContactMaterial(defaultContactMaterial);

            // 4. ZEMİN (Ground)
            // Görsel Zemin
            const planeGeo = new THREE.PlaneGeometry(50, 50);
            const planeMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
            const planeMesh = new THREE.Mesh(planeGeo, planeMat);
            planeMesh.rotation.x = -Math.PI * 0.5;
            planeMesh.receiveShadow = true;
            scene.add(planeMesh);
            
            // Grid Helper (Mühendislik Izgarası)
            const grid = new THREE.GridHelper(50, 50, 0x38bdf8, 0x334155);
            scene.add(grid);

            // Fizik Zemini
            const planeShape = new CANNON.Plane();
            planeBody = new CANNON.Body({
                mass: 0, // 0 kütle = Sabit (Hareket etmez)
                shape: planeShape,
                material: defaultMaterial
            });
            planeBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI * 0.5);
            world.addBody(planeBody);

            // 5. RENDERER
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true; // Gölgeleri aç
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // 6. CONTROLS & RAYCASTER
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // EVENTS
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onClick);
        }

        // --- NESNE OLUŞTURMA FONKSİYONU ---
        function createBox(width, height, depth, position) {
            // 1. Three.js Mesh (Görsel)
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(width, height, depth),
                concreteMaterial
            );
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.position.copy(position);
            scene.add(mesh);

            // 2. Cannon.js Body (Fizik)
            const shape = new CANNON.Box(new CANNON.Vec3(width * 0.5, height * 0.5, depth * 0.5));
            const body = new CANNON.Body({
                mass: 1, // 1kg kütle (Düşmesi için > 0 olmalı)
                position: new CANNON.Vec3(position.x, position.y, position.z),
                shape: shape
            });
            world.addBody(body);

            // 3. Güncelleme listesine ekle
            objectsToUpdate.push({ mesh, body });
            updateCount();
        }

        function createSphere(radius, position, velocity) {
            // Görsel
            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(radius, 32, 32),
                testBallMaterial
            );
            mesh.castShadow = true;
            mesh.position.copy(position);
            scene.add(mesh);

            // Fizik
            const shape = new CANNON.Sphere(radius);
            const body = new CANNON.Body({
                mass: 5, // Gülle daha ağır olsun
                position: new CANNON.Vec3(position.x, position.y, position.z),
                shape: shape,
            });
            
            // Fırlatma hızı
            if(velocity) {
                body.velocity.copy(velocity);
            }

            world.addBody(body);
            objectsToUpdate.push({ mesh, body });
            updateCount();
        }

        // --- ETKİLEŞİM ---
        function onClick(event) {
            // Instruction yazısını gizle
            document.getElementById('instruction').style.opacity = 0;

            // Eğer UI butonuna tıklandıysa oyuna müdahale etme
            if(event.target.closest('#ui-container') || event.target.closest('header')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            // Neye tıkladık? (Sadece görsel nesneleri değil, görünmez bir düzlemi de kontrol edebiliriz ama burada basit tutalım)
            const intersects = raycaster.intersectObjects(scene.children);

            if (intersects.length > 0) {
                const hitPoint = intersects[0].point;
                const hitNormal = intersects[0].face.normal;

                if (mode === 'build') {
                    // Tıklanan yerin biraz üstüne kutu koy (normal vektörünü kullanarak)
                    // Yüksekliği sabitlemek yerine, tıklanan yüzeyin üzerine ekliyoruz.
                    const spawnPos = new THREE.Vector3()
                        .copy(hitPoint)
                        .add(hitNormal.multiplyScalar(0.55)); // Yarım boyuttan biraz fazla ki içine girmesin
                    
                    // Izgaraya hizala (Grid Snap) - Mühendislik hassasiyeti için
                    spawnPos.x = Math.round(spawnPos.x);
                    spawnPos.z = Math.round(spawnPos.z);
                    
                    // Yüksekliği ayarlarken yere gömülmesini engelle
                    if(spawnPos.y < 0.5) spawnPos.y = 0.5;

                    createBox(1, 1, 1, spawnPos);
                } 
                else if (mode === 'test') {
                    // Kameradan tıklanan noktaya doğru gülle fırlat
                    const shootDirection = new THREE.Vector3().subVectors(hitPoint, camera.position).normalize();
                    const velocity = shootDirection.multiplyScalar(25); // Hız faktörü
                    
                    // Gülleyi kameranın biraz önünden oluştur
                    const spawnPos = camera.position.clone().add(shootDirection.multiplyScalar(2));
                    createSphere(0.4, spawnPos, new CANNON.Vec3(velocity.x, velocity.y, velocity.z));
                }
            }
        }

        // --- ANİMASYON DÖNGÜSÜ ---
        function animate() {
            requestAnimationFrame(animate);

            // 1. Fizik Dünyasını İlerlet
            world.step(timeStep);

            // 2. Görsel Nesneleri Fizik Nesnelerine Eşitle
            for (const object of objectsToUpdate) {
                object.mesh.position.copy(object.body.position);
                object.mesh.quaternion.copy(object.body.quaternion);
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function updateCount() {
            document.getElementById('count').innerText = objectsToUpdate.length;
        }

        // --- UI INTERFACE FONKSİYONLARI ---
        window.setMode = function(newMode) {
            mode = newMode;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            if(newMode === 'build') document.getElementById('btn-build').classList.add('active');
            if(newMode === 'test') document.getElementById('btn-test').classList.add('active');
        };

        window.resetWorld = function() {
            // Sahnedeki tüm dinamik objeleri sil
            for(const obj of objectsToUpdate) {
                world.removeBody(obj.body);
                scene.remove(obj.mesh);
            }
            objectsToUpdate = [];
            updateCount();
        };
    </script>
</body>
</html>
