<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fizik Tabanlı Yapı Testi | MGL</title>
    <style>
        /* --- TASARIM AYARLARI --- */
        :root {
            --bg-color: #0f172a;
            --primary: #f59e0b;
            --secondary: #38bdf8;
            --text-main: #f1f5f9;
        }

        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-main); }

        /* UI PANELİ */
        #ui-container {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            padding: 15px 25px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);
            text-align: center; user-select: none; backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            width: 90%; max-width: 600px; pointer-events: none;
            z-index: 100;
        }
        
        .controls { display: flex; gap: 10px; justify-content: center; pointer-events: auto; margin-top: 10px; }

        .btn {
            background: rgba(255,255,255,0.1); color: var(--text-main); border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; gap: 8px; font-size: 0.9rem;
        }
        .btn:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
        .btn.active { background: var(--primary); color: #000; border-color: var(--primary); box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
        .btn.danger { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #ef4444; }
        .btn.danger:hover { background: #ef4444; color: white; }

        h2 { margin: 0 0 5px 0; font-size: 1.1rem; color: var(--secondary); letter-spacing: 1px; text-transform: uppercase; }
        
        /* HEADER */
        header {
            position: absolute; top: 0; width: 100%; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10; pointer-events: none;
        }
        .home-btn {
            pointer-events: auto; text-decoration: none; color: white; 
            background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 30px;
            backdrop-filter: blur(5px); font-weight: 600; font-size: 0.9rem;
            transition: 0.3s; display: flex; align-items: center; gap: 5px;
        }
        .home-btn:hover { background: var(--secondary); color: #000; }

        /* BİLGİ KUTUSU */
        #instruction {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); color: white; padding: 15px 25px; border-radius: 50px;
            pointer-events: none; transition: opacity 0.5s; z-index: 50; text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>

    <header>
        <a href="index.html" class="home-btn"><i class="fas fa-arrow-left"></i> Ana Sayfa</a>
        <div style="color:var(--text-main); font-weight:bold; font-size:1.2rem; text-shadow: 0 0 10px rgba(56,189,248,0.5);">MGL<span style="color:var(--primary)">.LAB</span></div>
    </header>

    <div id="instruction">
        <i class="fas fa-mouse-pointer"></i> Başlamak için herhangi bir yere tıkla!
    </div>

    <div id="ui-container">
        <h2>Şantiye Kontrol Paneli</h2>
        <div class="controls">
            <button class="btn active" id="btn-build" onclick="setMode('build')">
                <i class="fas fa-cube"></i> İnşa Et
            </button>
            <button class="btn" id="btn-test" onclick="setMode('test')">
                <i class="fas fa-bomb"></i> Gülle Testi
            </button>
            <button class="btn danger" onclick="resetWorld()">
                <i class="fas fa-trash-alt"></i> Temizle
            </button>
        </div>
        <div style="margin-top:10px; font-size:0.8rem; color:#94a3b8;">
            Nesne Sayısı: <span id="count" style="color:var(--secondary)">0</span> | 
            <span style="opacity:0.7">Sol Tık: İşlem | Sağ Tık: Kamera</span>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as CANNON from 'cannon-es';

        // --- DEĞİŞKENLER ---
        let camera, scene, renderer;
        let world; 
        let timeStep = 1 / 60;
        let objectsToUpdate = []; 
        let clickableObjects = []; // Sadece tıklanabilir nesneler (zemin + kutular)
        let raycaster, mouse;
        let mode = 'build'; 

        // Materyaller
        const concreteMaterial = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.1 });
        const highlightMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true }); // Hata ayıklama için

        init();
        animate();

        function init() {
            // 1. SAHNE
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.Fog(0x0f172a, 30, 150); // Sis efekti derinlik katar

            // 2. KAMERA
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 15, 20);

            // 3. IŞIKLANDIRMA
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(20, 50, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // 4. FİZİK DÜNYASI
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            world.broadphase = new CANNON.SAPBroadphase(world);
            world.allowSleep = true;

            const defaultMaterial = new CANNON.Material('default');
            const contactMaterial = new CANNON.ContactMaterial(defaultMaterial, defaultMaterial, {
                friction: 0.5,
                restitution: 0.1
            });
            world.addContactMaterial(contactMaterial);

            // 5. ZEMİN (İki Parçalı: Görsel Grid + Tıklanabilir Görünmez Zemin)
            
            // A) Görsel Izgara (Grid)
            const grid = new THREE.GridHelper(100, 100, 0x38bdf8, 0x1e293b);
            grid.position.y = 0.01; // Z-fighting olmasın diye çok az yukarıda
            scene.add(grid);

            // B) Tıklanabilir Zemin (Raycaster için Mesh)
            const floorGeo = new THREE.PlaneGeometry(200, 200); // Çok büyük bir zemin
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x1e293b, 
                roughness: 0.8,
                side: THREE.DoubleSide
            });
            const floorMesh = new THREE.Mesh(floorGeo, floorMat);
            floorMesh.rotation.x = -Math.PI * 0.5;
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);
            clickableObjects.push(floorMesh); // Bunu tıklanabilirler listesine ekle!

            // C) Fizik Zemin (CannonJS)
            const floorBody = new CANNON.Body({
                mass: 0,
                shape: new CANNON.Plane(),
                material: defaultMaterial
            });
            floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI * 0.5);
            world.addBody(floorBody);

            // 6. RENDERER
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // 7. KONTROLLER
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Yerin altına girmeyi engelle

            // 8. RAYCASTER
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // EVENTS
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onPointerDown); // Click yerine pointerdown daha seri tepki verir
        }

        function createBox(position) {
            const width = 2;
            const height = 2;
            const depth = 2;

            // Görsel Mesh
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(width, height, depth),
                concreteMaterial
            );
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.position.copy(position);
            scene.add(mesh);
            clickableObjects.push(mesh); // Yeni kutuyu da tıklanabilir yap

            // Fizik Body
            const shape = new CANNON.Box(new CANNON.Vec3(width/2, height/2, depth/2));
            const body = new CANNON.Body({
                mass: 5, // 5kg
                position: new CANNON.Vec3(position.x, position.y, position.z),
                shape: shape
            });
            world.addBody(body);

            // Eşleştirme Listesine Ekle
            objectsToUpdate.push({ mesh, body });
            updateCount();

            // Animasyon (Pop-up)
            mesh.scale.set(0,0,0);
            let s = 0;
            function animateSpawn(){
                s += 0.1;
                mesh.scale.set(s,s,s);
                if(s < 1) requestAnimationFrame(animateSpawn);
            }
            animateSpawn();
        }

        function createBall(startPos, velocity) {
            const radius = 0.8;
            
            // Görsel
            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(radius, 32, 32),
                new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.8, roughness: 0.2 })
            );
            mesh.castShadow = true;
            mesh.position.copy(startPos);
            scene.add(mesh);

            // Fizik
            const shape = new CANNON.Sphere(radius);
            const body = new CANNON.Body({
                mass: 20, // Çok ağır gülle
                position: new CANNON.Vec3(startPos.x, startPos.y, startPos.z),
                shape: shape
            });
            body.velocity.copy(velocity);
            body.linearDamping = 0.1; // Hava sürtünmesi

            world.addBody(body);
            objectsToUpdate.push({ mesh, body });
            updateCount();
        }

        function onPointerDown(event) {
            // UI'a tıklanırsa oyunu etkileme
            if(event.target.closest('#ui-container') || event.target.closest('header')) return;
            
            // Sağ tık (kamera hareketi) ise işlem yapma
            if(event.button !== 0) return;

            document.getElementById('instruction').style.opacity = 0;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            // Sadece CLICKABLE listesindekileri kontrol et (Grid çizgilerini vs. görmezden gel)
            const intersects = raycaster.intersectObjects(clickableObjects);

            if (intersects.length > 0) {
                const hit = intersects[0];
                
                if (!hit.face) return; // Güvenlik önlemi

                const point = hit.point;
                const normal = hit.face.normal;

                if (mode === 'build') {
                    // Yeni pozisyon: Tıklanan nokta + normal yönünde yarım kutu boyutu
                    // Grid Snapping (Izgaraya yapışma)
                    const gridSize = 2; // Kutu boyutuyla aynı
                    
                    // Normal vektörünü kullanarak tam koordinatı bul
                    // Hafif offset ekliyoruz ki iç içe girmesin
                    const targetX = Math.round(point.x / gridSize) * gridSize;
                    const targetZ = Math.round(point.z / gridSize) * gridSize;
                    let targetY = point.y + (normal.y * 1); // 1 = kutu boyunun yarısı

                    // Eğer zemine tıklıyorsak Y'yi sabitle
                    if(Math.abs(normal.y) > 0.9) {
                         // Yerden yükseklik hesaplaması (Üst üste koyma mantığı)
                         // Burada fizik motoru olduğu için direkt fiziksel pozisyona bırakabiliriz
                         targetY = point.y + 1;
                    } else {
                        // Yana koyuyorsak
                         targetY = point.y;
                    }

                    // Yeni kütle tam sayılara otursun
                    createBox(new THREE.Vector3(targetX, targetY, targetZ));
                } 
                else if (mode === 'test') {
                    // Gülle atma mantığı
                    const startPos = camera.position.clone();
                    const direction = new THREE.Vector3().subVectors(point, startPos).normalize();
                    const velocity = direction.multiplyScalar(30); // Fırlatma hızı
                    
                    // Gülle kameranın içinden çıkmasın, biraz önünden çıksın
                    startPos.add(direction.multiplyScalar(2));
                    
                    createBall(startPos, new CANNON.Vec3(velocity.x, velocity.y, velocity.z));
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // Fizik adımını güvenli şekilde at
            try {
                world.step(timeStep);
            } catch(e) { console.warn("Fizik hatası:", e); }

            // Görsel güncelleme
            for (const obj of objectsToUpdate) {
                obj.mesh.position.copy(obj.body.position);
                obj.mesh.quaternion.copy(obj.body.quaternion);
                
                // Çok aşağı düşenleri sil (Performans için)
                if(obj.mesh.position.y < -50) {
                    world.removeBody(obj.body);
                    scene.remove(obj.mesh);
                    // Diziden silme işlemi karmaşık olmasın diye burada bırakıyoruz,
                    // Gerçek projede array'den de splice yapılmalı.
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateCount() {
            document.getElementById('count').innerText = objectsToUpdate.length;
        }

        // Global Fonksiyonlar
        window.setMode = function(m) {
            mode = m;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + m).classList.add('active');
        }

        window.resetWorld = function() {
            // Tüm dinamik nesneleri temizle
            for(const obj of objectsToUpdate) {
                world.removeBody(obj.body);
                scene.remove(obj.mesh);
                
                // Clickable listesinden de çıkar (zemin hariç)
                const index = clickableObjects.indexOf(obj.mesh);
                if(index > -1) clickableObjects.splice(index, 1);
            }
            objectsToUpdate = [];
            updateCount();
        }
    </script>
</body>
</html>
