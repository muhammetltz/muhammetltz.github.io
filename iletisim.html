<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim | MGL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a; --primary: #f59e0b; --secondary: #38bdf8;
            --glass: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f1f5f9; --text-muted: #94a3b8;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }

        /* HEADER */
        header {
            position: fixed; top: 0; width: 100%; padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; backdrop-filter: blur(10px); background: rgba(15, 23, 42, 0.85);
            border-bottom: 1px solid var(--glass-border);
        }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--text-main); text-decoration: none; }
        .logo span { color: var(--primary); }

        nav ul { display: flex; list-style: none; gap: 20px; }
        nav a { text-decoration: none; color: var(--text-main); transition: 0.3s; }
        .menu-toggle { display: none; font-size: 1.8rem; cursor: pointer; }

        /* CONTACT WRAPPER */
        .contact-wrapper {
            margin-top: 100px; padding: 40px 10%; flex: 1;
            display: flex; justify-content: center; align-items: flex-start; gap: 40px; flex-wrap: wrap;
        }
        .contact-info, .contact-form-container { flex: 1; min-width: 300px; }

        .info-card {
            background: var(--glass); border: 1px solid var(--glass-border); padding: 20px;
            border-radius: 10px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px;
        }
        .info-icon { width: 40px; height: 40px; background: rgba(56, 189, 248, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--secondary); }

        .contact-form { background: var(--glass); border: 1px solid var(--glass-border); padding: 30px; border-radius: 15px; }
        .input-field {
            width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border); border-radius: 5px; color: white;
        }
        .submit-btn {
            width: 100%; padding: 15px; background: linear-gradient(45deg, var(--primary), #d97706);
            border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer;
        }

        footer { text-align: center; padding: 20px; background: rgba(15, 23, 42, 0.9); margin-top: auto; }
        .socials a { color: var(--text-main); font-size: 1.5rem; margin: 0 10px; }

        /* MOBIL STİLLER */
        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            nav {
                position: absolute; top: 100%; left: 0; width: 100%; display: none;
                flex-direction: column; background: rgba(15, 23, 42, 0.95); padding: 20px;
            }
            nav.active { display: flex; }
            nav ul { flex-direction: column; gap: 20px; text-align: center; }
            .contact-wrapper { padding: 20px 5%; margin-top: 80px; }
        }
    </style>
</head>
<body>
    <canvas id="canvas-container"></canvas>

    <header>
        <a href="index.html" class="logo">MGL<span>.ENG</span></a>
        <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        <nav id="navbar">
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="index.html#portfolio">Projeler</a></li>
                <li><a href="oyun.html">Oyun</a></li>
                <li><a href="iletisim.html" style="color:var(--primary)">İletişim</a></li>
            </ul>
        </nav>
    </header>

    <div class="contact-wrapper">
        <div class="contact-info">
            <h2>Bana Ulaşın</h2>
            <p style="margin-bottom:20px; color:var(--text-muted)">Sorularınız için yazabilirsiniz.</p>
            
            <div class="info-card">
                <div class="info-icon"><i class="fas fa-envelope"></i></div>
                <div><h4>E-Posta</h4><p>muhammedguvenlotoz@gmail.com</p></div>
            </div>
            <div class="info-card">
                <div class="info-icon"><i class="fab fa-instagram"></i></div>
                <div><h4>Instagram</h4><a href="https://instagram.com/muhammetltz" style="color:var(--text-muted)">@muhammetltz</a></div>
            </div>
        </div>

        <div class="contact-form-container">
            <form class="contact-form" action="https://formspree.io/f/xgvzondn" method="POST">
                <h3>Mesaj Gönder</h3>
                <br>
                <input type="text" name="name" class="input-field" placeholder="Adınız" required>
                <input type="email" name="email" class="input-field" placeholder="E-Posta" required>
                <textarea name="message" rows="5" class="input-field" placeholder="Mesajınız" required></textarea>
                <button type="submit" class="submit-btn">Gönder</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="socials">
            <a href="https://twitter.com/muhammetltz"><i class="fab fa-twitter"></i></a>
            <a href="https://www.youtube.com/@muhammetltz"><i class="fab fa-youtube"></i></a>
            <a href="https://instagram.com/muhammetltz"><i class="fab fa-instagram"></i></a>
        </div>
        <p>&copy; 2025 Muhammed Güven Lotoz.</p>
    </footer>

    <script>
        function toggleMenu() { document.getElementById('navbar').classList.toggle('active'); }
        // Animasyon kodunun aynısı (Sadelik için kısalttım, ama çalışır)
        const canvas = document.getElementById("canvas-container"), ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        function anim() { requestAnimationFrame(anim); ctx.clearRect(0,0,canvas.width,canvas.height); }
        anim(); // Bu sayfada sadece arka plan temiz kalsın, çok parçacık olmasın form odaklı
    </script>
</body>
</html>
